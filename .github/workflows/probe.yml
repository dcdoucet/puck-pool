name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== ESPN"; curl -fsSL "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=20261121" | jq -c '.events[:3][] | {n: .shortName, odds: .competitions[0].odds}' | head -c 3000; echo
          echo "== NHL partner US"; curl -fsSL "https://api-web.nhle.com/v1/partner-game/US/now" | jq -c '{keys: keys, g: (.games[:2] // [])}' | head -c 2500; echo
          echo "== ESPN abbrs"; curl -fsSL "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=20261121" | jq -c '[.events[].shortName]'
