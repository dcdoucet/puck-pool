name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://ntfy.sh/puckpool-614c7aa1d6ed-live/json?poll=1&since=45m" > live.txt
          echo "live messages in last 45 min: $(wc -l < live.txt)"
          tail -1 live.txt | jq -r '.time as $t | .message | fromjson | .g | to_entries[] | "\($t|todate) \(.key) \(.value.state) \(.value.as)-\(.value.hs) P\(.value.period)"'
