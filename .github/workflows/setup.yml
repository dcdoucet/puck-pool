name: setup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create picks store
        run: |
          if [ -f config.json ]; then echo "already set up"; exit 0; fi
          loc=$(curl -fsS -D - -o /dev/null -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"players":{}}' https://jsonblob.com/api/jsonBlob | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          id=${loc##*/}
          test -n "$id"
          echo "{\"blob\":\"$id\"}" > config.json
          curl -fsS "https://jsonblob.com/api/jsonBlob/$id"
          git config user.name "setup-bot"
          git config user.email "setup-bot@users.noreply.github.com"
          git add config.json && git commit -m "Add picks store" && git push
