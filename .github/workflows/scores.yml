name: scores
on:
  schedule:
    - cron: "*/5 17-23 21 11 *"
    - cron: "*/5 0-8 22 11 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: scores
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NHL scores
        run: |
          curl -fsSL https://api-web.nhle.com/v1/score/2026-11-21 \
            | jq '[.games[] | {key: (.id|tostring), value: {state: .gameState, as: (.awayTeam.score // 0), hs: (.homeTeam.score // 0)}}] | from_entries' > scores.new
          mv scores.new scores.json
      - name: Commit if changed
        run: |
          git config user.name "scores-bot"
          git config user.email "scores-bot@users.noreply.github.com"
          git add scores.json
          git diff --cached --quiet || (git commit -m "Update scores" && git push)
