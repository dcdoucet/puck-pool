name: sync
on:
  schedule:
    - cron: "*/5 * 20-22 11 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: sync
env:
  TOPIC: puckpool-614c7aa1d6ed
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive picks
        run: |
          [ -f picks.json ] || echo '[]' > picks.json
          curl -fsS "https://ntfy.sh/$TOPIC/json?poll=1&since=all" \
            | jq -s '[.[] | select(.event=="message") | {id, time, message}]' > new.json
          jq -s '(.[0] + .[1]) | unique_by(.id) | sort_by(.time)' picks.json new.json > merged.json
          mv merged.json picks.json && rm new.json
          echo "events: $(jq length picks.json)"
      - name: Fetch NHL scores
        run: python3 nhl.py || echo "scores fetch failed"
      - name: Fetch team logos (once)
        run: |
          mkdir -p logos
          for T in EDM CAR CHI CGY BUF FLA PIT NSH WSH BOS CBJ TOR PHI MTL LAK OTT NYI DET NJD STL VGK WPG ANA UTA MIN VAN SEA SJS; do
            for V in light dark; do
              [ -s logos/${T}_${V}.svg ] || curl -fsSL "https://assets.nhle.com/logos/nhl/svg/${T}_${V}.svg" -o logos/${T}_${V}.svg || rm -f logos/${T}_${V}.svg
            done
          done
          ls logos | wc -l
      - name: Fetch pregame odds (frozen at puck drop)
        run: |
          [ -f odds.json ] || echo '{}' > odds.json
          curl -fsSL https://api-web.nhle.com/v1/partner-game/US/now -o partner.json || exit 0
          jq --slurpfile sc scores.json '
            (.bettingPartner.name // "sportsbook") as $src | (.lastUpdatedUTC // "") as $at |
            [ .games[]? | (.gameId|tostring) as $id
              | select($sc[0][$id] != null) | select($sc[0][$id].state=="FUT" or $sc[0][$id].state=="PRE")
              | {key: $id, value: {
                  a: ([.awayTeam.odds[]? | select(.description=="MONEY_LINE_2_WAY") | .value][0]),
                  h: ([.homeTeam.odds[]? | select(.description=="MONEY_LINE_2_WAY") | .value][0]),
                  src: $src, at: $at}}
              | select(.value.a != null and .value.h != null) ] | from_entries' partner.json > fresh.json
          jq -s '.[0] * .[1]' odds.json fresh.json > merged.json && mv merged.json odds.json
          rm -f partner.json fresh.json
          echo "odds for $(jq length odds.json) games"
      - name: Commit if changed
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add picks.json scores.json odds.json logos
          git diff --cached --quiet || (git commit -m "Sync picks and scores" && git push)
