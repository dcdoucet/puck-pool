<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puck Pool</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#111;--mute:#777;--line:#e3e3e3;--on:#1d4ed8;--onbg:#e6edff;--good:#0f7a3e;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--ink:#eee;--mute:#999;--line:#2a2f37;--on:#6c9bff;--onbg:#1a2747;--good:#4ad08a;--bad:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:auto;padding:16px max(16px,env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:19px;margin:28px 0 8px}
.mute{color:var(--mute);font-size:15px}
input,button{font:inherit;border-radius:10px;min-height:48px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px}
button{border:0;background:var(--on);color:#fff;font-weight:600;padding:10px 16px;cursor:pointer}
.link{background:none;color:var(--on);padding:0;min-height:0;font-weight:500}
form{display:flex;gap:8px;margin-top:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.t{background:var(--bg);color:var(--ink);border:2px solid var(--line);font-size:20px;font-weight:700;min-height:56px;display:flex;justify-content:center;align-items:center;gap:8px}
.t.on{border-color:var(--on);background:var(--onbg);color:var(--on)}
.t:disabled{opacity:.6;cursor:default}.t.on:disabled{opacity:1}
.t.w{border-color:var(--good);color:var(--good);opacity:1}.t.l{border-color:var(--bad);color:var(--bad);opacity:1}
.t small{font-size:15px;font-weight:500;color:var(--mute)}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:14px;color:var(--mute);font-weight:500}
td:first-child,th:first-child{text-align:left}
tr.me td{font-weight:700}
.out td{color:var(--mute)}
.msg{background:var(--onbg);padding:10px 12px;border-radius:10px;margin:10px 0}
.names button{display:block;width:100%;margin-top:6px;background:var(--onbg);color:var(--ink)}
</style></head><body><main>
<h1>Puck Pool</h1>
<div class="mute">NHL · Saturday, Nov 21 · 1 point per correct pick</div>
<div id="me"></div>
<div id="games"></div>
<h2>Standings</h2>
<table><thead><tr><th>Player</th><th>Pts</th><th>Max</th></tr></thead><tbody id="tbl"></tbody></table>
<p class="mute" id="foot"></p>
</main>
<script>
{
const G=[["2026020359","EDM","CAR","2026-11-21T18:00:00Z"],["2026020360","CHI","CGY","2026-11-21T20:30:00Z"],["2026020361","BUF","FLA","2026-11-21T23:00:00Z"],["2026020362","PIT","NSH","2026-11-21T23:00:00Z"],["2026020363","WSH","BOS","2026-11-22T00:00:00Z"],["2026020364","CBJ","TOR","2026-11-22T00:00:00Z"],["2026020365","PHI","MTL","2026-11-22T00:00:00Z"],["2026020366","LAK","OTT","2026-11-22T00:00:00Z"],["2026020367","NYI","DET","2026-11-22T00:00:00Z"],["2026020368","NJD","STL","2026-11-22T00:00:00Z"],["2026020369","VGK","WPG","2026-11-22T00:00:00Z"],["2026020370","ANA","UTA","2026-11-22T02:00:00Z"],["2026020371","MIN","VAN","2026-11-22T03:00:00Z"],["2026020372","SEA","SJS","2026-11-22T03:00:00Z"]].map(([id,a,h,t])=>({id,a,h,t:Date.parse(t)}));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let BLOB=null,data={players:{}},scores={},me=null,busy=false,choosing=false,err='';
try{me=localStorage.getItem('pp_me')}catch{}
const save=id=>{me=id;try{localStorage.setItem('pp_me',id)}catch{}};
const api=()=>'https://jsonblob.com/api/jsonBlob/'+BLOB;
const locked=g=>Date.now()>=g.t||(scores[g.id]&&!['FUT','PRE'].includes(scores[g.id].state));
const result=g=>{const s=scores[g.id];if(!s||!['FINAL','OFF'].includes(s.state))return null;return s.hs>s.as?'H':'A'};
async function load(){
  try{
    if(!BLOB){const c=await (await fetch('config.json?t='+Date.now())).json();BLOB=c.blob}
    const [d,s]=await Promise.all([fetch(api(),{cache:'no-store'}).then(r=>r.json()),fetch('scores.json?t='+Date.now()).then(r=>r.json()).catch(()=>({}))]);
    data=d&&d.players?d:{players:{}};scores=s||{};err='';
  }catch(e){err="Can't load right now. Pull to refresh."}
  render();
}
async function write(mutate){
  // read-merge-write, then verify; retry if someone else's save clobbered ours
  for(let i=0;i<4;i++){
    const cur=await fetch(api(),{cache:'no-store'}).then(r=>r.json());
    if(!cur.players)cur.players={};
    mutate(cur);
    await fetch(api(),{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(cur)});
    const chk=await fetch(api(),{cache:'no-store'}).then(r=>r.json());
    const want=JSON.stringify(cur.players[me]),got=JSON.stringify(chk.players?.[me]);
    data=chk;if(want===got)return true;
    await new Promise(r=>setTimeout(r,300+Math.random()*700));
  }
  return false;
}
function render(){
  const P=data.players,mine=me&&P[me];
  let h=err?`<div class="msg">${esc(err)}</div>`:'';
  if(!BLOB&&!err)h+='<div class="msg">Loading…</div>';
  else if(!mine){
    const names=Object.entries(P);
    h+=choosing?`<div class="names"><p class="mute">Tap your name:</p>${names.map(([id,p])=>`<button data-claim="${esc(id)}">${esc(p.name)}</button>`).join('')}<p><button class="link" data-x="back">Back</button></p></div>`
    :`<form id="join"><input id="nick" maxlength="16" placeholder="Your name" autocomplete="off" required><button>Join</button></form>${names.length?'<p><button class="link" data-x="claim">Already joined on another phone?</button></p>':''}`;
  }else{
    const n=G.filter(g=>mine.picks?.[g.id]).length;
    h+=`<p>Picking as <b>${esc(mine.name)}</b> · ${n}/14 picked · <button class="link" data-x="out">Not you?</button></p>`;
  }
  $('me').innerHTML=h;
  $('games').innerHTML=mine?G.map(g=>{
    const k=mine.picks?.[g.id],lk=locked(g),r=result(g),s=scores[g.id],sc=s&&!['FUT','PRE'].includes(s.state);
    const b=(side,ab,pts)=>{let c='t';if(k===side)c+=r?(r===side?' w':' l'):' on';return `<button class="${c}" data-g="${g.id}" data-s="${side}" ${lk?'disabled':''}>${ab}${sc?` <small>${pts}</small>`:''}</button>`};
    return `<div class="g">${b('A',g.a,s?.as)}${b('H','@ '+g.h,s?.hs)}</div>`}).join(''):'';
  // standings
  const left=G.filter(g=>!result(g));
  const rows=Object.entries(P).map(([id,p])=>{let pts=0,max=0;for(const g of G){const k=p.picks?.[g.id],r=result(g);if(r){if(k===r)pts++}else if(k)max++}return{id,p,pts,max:pts+max}});
  const lead=Math.max(0,...rows.map(r=>r.pts));
  rows.sort((a,b)=>b.pts-a.pts||b.max-a.max||a.p.name.localeCompare(b.p.name));
  $('tbl').innerHTML=rows.length?rows.map(r=>`<tr class="${r.id===me?'me':''} ${r.max<lead?'out':''}"><td>${esc(r.p.name)}${r.max<lead?' · out':''}</td><td>${r.pts}</td><td>${r.max}</td></tr>`).join(''):'<tr><td colspan="3" class="mute">No one yet.</td></tr>';
  $('foot').textContent=`${left.length} of 14 games left. Max = most points still possible. Picks lock when each game starts.`;
}
document.addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;const n=$('nick').value.trim().slice(0,16);if(!n)return;
  busy=true;const id='p'+Math.random().toString(36).slice(2,10);save(id);
  try{if(!await write(d=>{d.players[id]={name:n,picks:{}}}))err='Save failed, try again.'}catch{err='Save failed, try again.'}
  busy=false;render();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.x==='claim'){choosing=true;render()}
  else if(b.dataset.x==='back'){choosing=false;render()}
  else if(b.dataset.x==='out'){me=null;try{localStorage.removeItem('pp_me')}catch{};render()}
  else if(b.dataset.claim){save(b.dataset.claim);choosing=false;render()}
  else if(b.dataset.g&&!busy){
    const g=G.find(x=>x.id===b.dataset.g),side=b.dataset.s;if(!g||locked(g))return;
    busy=true;data.players[me].picks={...data.players[me].picks,[g.id]:side};render();
    try{if(!await write(d=>{if(d.players[me]){d.players[me].picks={...(d.players[me].picks||{}),[g.id]:side}}}))err='Pick didn’t save, tap again.'}catch{err='Pick didn’t save, tap again.'}
    busy=false;render();
  }
});
load();setInterval(()=>{if(!busy)load()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy)load()});
}
</script>
</body></html>
