<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Puck Pool</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#111;--mute:#777;--line:#e3e3e3;--on:#1d4ed8;--onbg:#e6edff;--good:#0f7a3e;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--ink:#eee;--mute:#999;--line:#2a2f37;--on:#6c9bff;--onbg:#1a2747;--good:#4ad08a;--bad:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:auto;padding:16px max(16px,env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:19px;margin:28px 0 8px}
.mute{color:var(--mute);font-size:15px}
input,button{font:inherit;border-radius:10px;min-height:48px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px}
button{border:0;background:var(--on);color:#fff;font-weight:600;padding:10px 16px;cursor:pointer}
.link{background:none;color:var(--on);padding:0;min-height:0;font-weight:500}
form{display:flex;gap:8px;margin-top:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.t{background:var(--bg);color:var(--ink);border:2px solid var(--line);font-size:20px;font-weight:700;min-height:56px;display:flex;justify-content:center;align-items:center;gap:8px}
.t.on{border-color:var(--on);background:var(--onbg);color:var(--on)}
.t:disabled{opacity:.6;cursor:default}.t.on:disabled{opacity:1}
.t.w{border-color:var(--good);color:var(--good);opacity:1}.t.l{border-color:var(--bad);color:var(--bad);opacity:1}
.t small{font-size:15px;font-weight:500;color:var(--mute)}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:14px;color:var(--mute);font-weight:500}
td:first-child,th:first-child{text-align:left}
tr.me td{font-weight:700}
.out td{color:var(--mute)}
.msg{background:var(--onbg);padding:10px 12px;border-radius:10px;margin:10px 0}
.names button{display:block;width:100%;margin-top:6px;background:var(--onbg);color:var(--ink)}
.lg{width:34px;height:34px;flex:none}
.nm{display:flex;align-items:center;gap:10px}
.done{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));width:100%;margin-top:8px;font-size:19px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.edit{width:100%;margin:6px 0 4px}
</style></head><body><main>
<h1>Puck Pool</h1>
<div class="mute">NHL · Saturday, Nov 21</div>
<div id="me"></div>
<div id="view"></div>
</main>
<script>
{
const G=[["2026020359","EDM","CAR","2026-11-21T18:00:00Z"],["2026020360","CHI","CGY","2026-11-21T20:30:00Z"],["2026020361","BUF","FLA","2026-11-21T23:00:00Z"],["2026020362","PIT","NSH","2026-11-21T23:00:00Z"],["2026020363","WSH","BOS","2026-11-22T00:00:00Z"],["2026020364","CBJ","TOR","2026-11-22T00:00:00Z"],["2026020365","PHI","MTL","2026-11-22T00:00:00Z"],["2026020366","LAK","OTT","2026-11-22T00:00:00Z"],["2026020367","NYI","DET","2026-11-22T00:00:00Z"],["2026020368","NJD","STL","2026-11-22T00:00:00Z"],["2026020369","VGK","WPG","2026-11-22T00:00:00Z"],["2026020370","ANA","UTA","2026-11-22T02:00:00Z"],["2026020371","MIN","VAN","2026-11-22T03:00:00Z"],["2026020372","SEA","SJS","2026-11-22T03:00:00Z"]].map(([id,a,h,t])=>({id,a,h,t:Date.parse(t)}));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOPIC='puckpool-614c7aa1d6ed',NT='https://ntfy.sh/'+TOPIC;
let view=null,ev=new Map(),P={},scores={},me=null,busy=false,choosing=false,err='',loaded=false;
try{me=localStorage.getItem('pp_me')}catch{}
const save=id=>{me=id;try{localStorage.setItem('pp_me',id)}catch{}};
const locked=g=>Date.now()>=g.t||(scores[g.id]&&!['FUT','PRE'].includes(scores[g.id].state));
const result=g=>{const s=scores[g.id];if(!s||!['FINAL','OFF'].includes(s.state))return null;return s.hs>s.as?'H':'A'};
function build(){
  // replay events in server-time order; a pick only counts if ntfy stamped it before puck drop
  P={};const list=[...ev.values()].sort((a,b)=>a.time-b.time);
  for(const e of list){let m;try{m=JSON.parse(e.message)}catch{continue}
    if(!m||typeof m.p!=='string')continue;
    if(m.t==='x')delete P[m.p];
    else if(m.t==='j'&&m.n&&!P[m.p])P[m.p]={name:String(m.n).slice(0,16),picks:{}};
    else if(m.t==='p'&&P[m.p]){const g=G.find(x=>x.id===m.g);if(g&&(m.s==='A'||m.s==='H')&&e.time*1000<g.t)P[m.p].picks[g.id]=m.s}}
}
const add=e=>{if(e&&e.id&&e.message)ev.set(e.id,e)};
async function load(){
  try{
    const t=Date.now();
    const [arc,live,s]=await Promise.all([
      fetch('picks.json?t='+t).then(r=>r.ok?r.json():[]).catch(()=>[]),
      fetch(NT+'/json?poll=1&since=all').then(r=>r.text()),
      fetch('scores.json?t='+t).then(r=>r.json()).catch(()=>({}))]);
    (arc||[]).forEach(add);
    live.split('\n').forEach(l=>{if(!l)return;try{const e=JSON.parse(l);if(e.event==='message')add(e)}catch{}});
    scores=s||{};err='';loaded=true;
  }catch(e){err="Can't load right now. Try again in a minute."}
  build();render();
}
async function post(msg){
  const r=await fetch(NT,{method:'POST',body:JSON.stringify(msg)});
  if(!r.ok)throw new Error(r.status);
  add(await r.json());build();
}
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const logo=ab=>`<img class="lg" alt="" src="https://assets.nhle.com/logos/nhl/svg/${ab}_${dark?'dark':'light'}.svg" onerror="this.remove()">`;
const fmt=n=>String(Math.round(n*10)/10);
function tally(){
  // each game's pot = everyone who picked it; the people who got it right split the pot
  const T={};for(const id in P)T[id]={pts:0,max:0};
  for(const g of G){
    const who=Object.keys(P).filter(id=>P[id].picks[g.id]);if(!who.length)continue;
    const pot=who.length,r=result(g);
    if(r){const w=who.filter(id=>P[id].picks[g.id]===r);for(const id of w)T[id].pts+=pot/w.length}
    else for(const id of who){const same=who.filter(x=>P[x].picks[g.id]===P[id].picks[g.id]).length;T[id].max+=pot/same}
  }
  for(const id in T)T[id].max+=T[id].pts;
  return T;
}
function render(){
  const mine=me&&P[me];
  if(loaded&&view===null)view=mine&&G.every(g=>locked(g)||mine.picks[g.id])?'table':'pick';
  let h=err?`<div class="msg">${esc(err)}</div>`:'';
  if(!loaded&&!err)h+='<div class="msg">Loading…</div>';
  else if(!mine){
    const names=Object.entries(P);
    h+=choosing?`<div class="names"><p class="mute">Tap your name:</p>${names.map(([id,p])=>`<button data-claim="${esc(id)}">${esc(p.name)}</button>`).join('')}<p><button class="link" data-x="back">Back</button></p></div>`
    :`<form id="join"><input id="nick" maxlength="16" placeholder="Your name" autocomplete="off" required><button>Join</button></form>${names.length?'<p><button class="link" data-x="claim">Already joined on another phone?</button></p>':''}`;
  }else h+=`<p><span>Picking as <b>${esc(mine.name)}</b> · <button class="link" data-x="out">Not you?</button> · <button class="link" data-x="del">Remove me</button></span></p>`;
  $('me').innerHTML=h;
  if(mine&&view==='pick'){
    $('view').innerHTML=G.map(g=>{
      const k=mine.picks[g.id],lk=locked(g),r=result(g),s=scores[g.id],sc=s&&!['FUT','PRE'].includes(s.state);
      const b=(side,ab,pts)=>{let c='t';if(k===side)c+=r?(r===side?' w':' l'):' on';return `<button class="${c}" data-g="${g.id}" data-s="${side}" ${lk?'disabled':''}>${logo(ab)}${side==='H'?'@ ':''}${ab}${sc?` <small>${pts}</small>`:''}</button>`};
      return `<div class="g">${b('A',g.a,s?.as)}${b('H',g.h,s?.hs)}</div>`}).join('')+'<button class="done" data-x="done">Done</button>';
    return;
  }
  const T=tally(),ids=Object.keys(P),lead=Math.max(0,...ids.map(id=>T[id].pts));
  const rows=ids.map(id=>({id,p:P[id],...T[id]})).sort((a,b)=>b.pts-a.pts||b.max-a.max||a.p.name.localeCompare(b.p.name));
  $('view').innerHTML=(mine?'<button class="edit" data-x="edit">Edit picks</button>':'')+
    `<table><thead><tr><th>Player</th><th>Pts</th><th>Max</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr class="${r.id===me?'me':''} ${r.max<lead?'out':''}"><td><span class="nm">${esc(r.p.name)}${r.max<lead?' · out':''}</span></td><td>${fmt(r.pts)}</td><td>${fmt(r.max)}</td></tr>`).join(''):'<tr><td colspan="3" class="mute">No one yet.</td></tr>'}</tbody></table>
    <p class="mute">Each game is worth one point per person who picked it, split among everyone who got it right. Max is the most you can still finish with. Picks lock when each game starts.</p>`;
}
document.addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;const n=$('nick').value.trim().slice(0,16);if(!n)return;
  busy=true;view='pick';const id='p'+Math.random().toString(36).slice(2,10);save(id);
  try{await post({t:'j',p:id,n})}catch{err='Couldn’t join, try again.';me=null}
  busy=false;render();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.x==='claim'){choosing=true;render()}
  else if(b.dataset.x==='back'){choosing=false;render()}
  else if(b.dataset.x==='del'&&!busy){
    if(!confirm('Remove '+P[me].name+' and all their picks?'))return;
    busy=true;try{await post({t:'x',p:me});me=null;try{localStorage.removeItem('pp_me')}catch{};view=null;err=''}catch{err='Couldn’t remove, try again.'}
    busy=false;render();
  }
  else if(b.dataset.x==='done'){view='table';render();scrollTo(0,0)}
  else if(b.dataset.x==='edit'){view='pick';render();scrollTo(0,0)}
  else if(b.dataset.x==='out'){me=null;try{localStorage.removeItem('pp_me')}catch{};render()}
  else if(b.dataset.claim){save(b.dataset.claim);choosing=false;view=null;render()}
  else if(b.dataset.g&&!busy){
    const g=G.find(x=>x.id===b.dataset.g),side=b.dataset.s;if(!g||locked(g))return;
    busy=true;P[me].picks[g.id]=side;render();
    try{await post({t:'p',p:me,g:g.id,s:side});err=''}catch{err='Pick didn’t save, tap again.';build()}
    busy=false;render();
  }
});
load();setInterval(()=>{if(!busy)load()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy)load()});
}
</script>
</body></html>
