<style>

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px}
.sec h2{font-size:20px;margin:0;font-weight:750;white-space:nowrap}
.dim{color:var(--mute);font-weight:500}.acc{color:var(--acc)}
.lnk{color:var(--acc);font-weight:650;min-height:44px}
.list .lh,.list .p{display:grid;grid-template-columns:22px 32px 1fr 40px 44px 52px;gap:10px;align-items:center;padding:0 14px}
.list .lh{grid-template-columns:1fr 40px 44px 52px;font-size:12px;color:var(--mute);font-weight:600;min-height:32px}
.list .lh span{text-align:right}
.list .p{min-height:60px;border-top:1px solid var(--line);width:100%;text-align:left}
.list .p.mine{background:var(--accbg)}.list .p.out{opacity:.5}
.list .rk{color:var(--mute);font-weight:650;text-align:center}
.list .n{min-width:0;display:flex;flex-direction:column}.list .n b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list .n small{color:var(--mute);font-size:13px}
.list .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.list .v.dim{font-weight:500}
.list .f{display:flex;justify-content:space-between;gap:12px;padding:14px;border-top:1px solid var(--line);font-size:15px}.list .f:first-child{border:0}

.who{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.pk{max-height:60vh;overflow:auto;margin-top:4px}.pk div{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:16px}.pk div>span:last-child{font-weight:650}
.pk div{display:grid!important;grid-template-columns:1fr 64px 24px 64px 1fr;align-items:center;justify-items:center}
.pk div>.pkt:first-child{grid-column:2}

.pkt img{width:40px;height:28px;object-fit:contain}
.pkt.on{opacity:1;border-color:var(--acc);background:var(--accbg)}.pkt.hit{opacity:1;border-color:var(--good)}.pkt.miss{opacity:.6;border-color:var(--bad)}
.pst{grid-column:5;justify-self:end;font-weight:700}
.okc{color:var(--good)}.noc{color:var(--bad)}
.rules{padding-left:18px;margin:10px 0 4px;font-size:15px}.rules li{margin:6px 0}
.done{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));width:100%;margin-top:8px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:6px 14px 6px 8px;min-height:44px;font-weight:600}
.tl{width:48px;height:32px;object-fit:contain}
.t .tt small{font-size:18px;color:var(--ink);margin-left:2px}
.list .p{padding-bottom:10px}
.strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(14,1fr);gap:2px;margin-top:-2px}
.ps{position:relative;height:16px;display:flex;justify-content:center}

.ps.miss img{opacity:.22}
.ps.hit::after{content:"";position:absolute;right:0;bottom:-2px;width:7px;height:7px;border-radius:50%;background:var(--good);border:1.5px solid var(--card)}
.ps.none::before{content:"";width:8px;height:2px;background:var(--line);align-self:center}
.sl .lh,.sl .p{display:grid;grid-template-columns:16px 22px 64px minmax(0,1fr) 30px 36px 38px;gap:6px;align-items:center;padding:0 10px}
.sl .lh{font-size:12px;color:var(--mute);font-weight:600;min-height:32px}.sl .lh span{text-align:right}.sl .lh .pkh{grid-column:4;text-align:left}
.sl .lh span:first-child{grid-column:1/4}
.sl .p{min-height:54px;padding-bottom:0;cursor:pointer}
.sl .n{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .v{font-size:15px}
.sx{display:flex;gap:3px;overflow:hidden;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding:4px 0}
.sx::-webkit-scrollbar{display:none}
.sx .ps{flex:none;width:24px;height:18px}.sx .ps img{height:18px}
.f.nw{display:block;cursor:pointer}.f.nw.open{background:var(--accbg)}.f.nw b{display:block;font-size:16px;line-height:1.3;margin:2px 0 4px}.f.nw p{margin:0;color:var(--mute);font-size:15px;line-height:1.45}.pin{background:var(--card);border-radius:14px;padding:12px 14px;margin:6px 0 0;box-shadow:0 0 0 2px var(--acc) inset}.pin b{display:block;font-size:17px;line-height:1.3;margin:4px 0}.pin p{margin:0;color:var(--mute);font-size:15px;line-height:1.45}.pinh{display:flex;justify-content:space-between;align-items:center}.x{font-size:24px;line-height:1;color:var(--mute);min-width:44px;min-height:36px;text-align:right}
.nsh{font-size:15px;min-height:36px;margin-top:4px}
.nk{font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-300%);opacity:0;visibility:hidden;z-index:40;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;transition:transform .25s,opacity .25s,visibility .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.names button{display:block;width:100%;text-align:left;min-height:50px;border-bottom:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){#board{width:100%;display:block;border-radius:14px;margin:4px 0 10px;min-height:180px;background:var(--card)}
.fh{font-size:17px;margin:22px 2px 6px}
.feed{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px}
.feed li{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.feed li:last-child{border:0}
.feed time{flex:none;color:var(--mute);font-size:13px}
#toast{transition:none}}
</style></head><body>
<header><h1 data-tab="home" style="cursor:pointer">Puck Pool</h1><div id="hdr"></div></header>
<main id="main"><p class="mute">Loading…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet"></div>
<script src="crest.js"></script>
<script src="logic.js"></script>
<script src="board.js"></script>
<script>
{
const {G,GI}=PP;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOPIC='puckpool-614c7aa1d6ed',LIVE=TOPIC+'-live',NT='https://ntfy.sh/'+TOPIC;
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
const TC={EDM:'#ff4c00',CAR:'#ce1126',CHI:'#cf0a2c',CGY:'#c8102e',BUF:'#0057b8',FLA:'#c8102e',PIT:'#fcb514',NSH:'#ffb81c',WSH:'#c8102e',BOS:'#ffb81c',CBJ:'#2a5fae',TOR:'#2f6fd8',PHI:'#f74902',MTL:'#af1e2d',LAK:'#a2aaad',OTT:'#c52032',NYI:'#f47d30',DET:'#ce1126',NJD:'#ce1126',STL:'#2f6fd8',VGK:'#b4975a',WPG:'#55a0e0',ANA:'#f47a38',UTA:'#6cace4',MIN:'#2e8b57',VAN:'#00843d',SEA:'#99d9d9',SJS:'#00a3ad'};
let pinNews=null,openNews=null,NEWS=[],ev=new Map(),P={},base={},liveS={},S={},O={},seenAt={},me=ls.get('pp_me'),tab=null,busy=false,loaded=false,lastFull=0,open=null,sheet=null,err='';
const save=id=>{me=id;ls.set('pp_me',id);ls.set('pp_prev',id)};
const DARK=matchMedia('(prefers-color-scheme: dark)').matches;
const lg=(ab,cls)=>`<img class="${cls}" src="logos/${ab}_${DARK?'dark':'light'}.svg" alt="${ab}">`;
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const result=g=>PP.result(S,g),locked=g=>PP.started(S,g),mine=()=>me&&P[me];
let joins=[];
const FIRST=Math.min(...G.map(g=>g.t));
function left(){const s=Math.max(0,Math.floor((FIRST-Date.now())/1000)),d=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
  const H=Math.floor(s/3600);return H>=48?`${d}d ${hh}h`:H?`${H}h ${mm}m`:`${mm}:${String(ss).padStart(2,'0')}`}
function banner(){if(Date.now()>=FIRST)return '';
  return `<div class="banner"><div>First picks lock in <span class="cd" id="cd">${left()}</span></div>
  <p>Pick a winner in each game. Each game's points are split by everyone who got it right.</p>
  <details><summary>How scoring works</summary><ul>
  <li>Each game is worth 1 point for every person who picked it.</li>
  <li>Everyone who picked the winner splits those points. Picking against the crowd pays more.</li>
  <li>🔒 doubles your share for one game. You can move it until that game starts.</li>
  <li>Picks lock when each game starts, and nobody sees them until then.</li>
  <li>Max is the most you can still finish with. Win % comes from sportsbook odds plus live scores.</li></ul></details></div>`}
setInterval(()=>{const el=document.getElementById('cd');if(!el)return;if(Date.now()>=FIRST){render();return}el.textContent=left()},1000);
function build(){
  P={};joins=[];for(const e of [...ev.values()].sort((a,b)=>a.time-b.time)){let m;try{m=JSON.parse(e.message)}catch{continue}
    if(!m||typeof m.p!=='string')continue;const t=e.time*1000;
    if(m.t==='x'){delete P[m.p];joins=joins.filter(j=>j.id!==m.p);continue}
    else if(m.t==='j'&&m.n&&!P[m.p]){P[m.p]={name:String(m.n).slice(0,16),picks:{},lock:null};joins.push({id:m.p,name:P[m.p].name,ts:t})}
    else if(!P[m.p])continue;
    else if(m.t==='m'&&Number.isInteger(m.m)&&m.m>=0&&m.m<MASCOTS.length)P[m.p].mascot=m.m;
    else if(m.t==='p'){const g=GI[m.g];if(g&&(m.s==='A'||m.s==='H')&&t<g.t)P[m.p].picks[g.id]=m.s}
  }
  S={...base};for(const id in liveS)if(!S[id]||(liveS[id].u||0)>(S[id].u||0))S[id]=liveS[id];
}
const add=e=>{if(e&&e.id&&e.message)ev.set(e.id,e)};
async function load(){
  try{
    const t=Date.now(),full=t-lastFull>55000||!loaded;
    const [nt,arc,s,o,nw]=await Promise.all([
      fetch(`https://ntfy.sh/${TOPIC},${LIVE}/json?poll=1&since=all`).then(r=>r.text()),
      full?fetch('picks.json?t='+t).then(r=>r.ok?r.json():[]).catch(()=>[]):null,
      full?fetch('scores.json?t='+t).then(r=>r.json()).catch(()=>null):null,
      full?fetch('odds.json?t='+t).then(r=>r.json()).catch(()=>null):null,
      full?fetch('news.json?t='+t).then(r=>r.json()).catch(()=>null):null]);
    if(full){(arc||[]).forEach(add);if(s)base=s;if(o)O=o;if(Array.isArray(nw))NEWS=nw;lastFull=t}
    for(const l of nt.split('\n')){if(!l)continue;let e;try{e=JSON.parse(l)}catch{continue}if(e.event!=='message')continue;
      if(e.topic===LIVE){try{const m=JSON.parse(e.message),tt=e.time*1000;for(const id in m.g||{}){const x=m.g[id];
        if(PP.isFinal(x)&&(!seenAt['f:'+id]||tt<seenAt['f:'+id]))seenAt['f:'+id]=tt;
        if(!liveS[id]||(x.u||0)>=(liveS[id].u||0))liveS[id]=x}}catch{}}
      else add(e)}
    err='';loaded=true;
  }catch{err="Can't connect. Retrying…"}
  build();render();notify();
}
async function post(msg){const r=await fetch(NT,{method:'POST',body:JSON.stringify(msg)});if(!r.ok)throw 0;add(await r.json());build()}
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2600)}
function render(){
  const m=mine();
  if(loaded&&!tab)tab=m&&G.every(g=>locked(g)||m.picks[g.id])?'home':'pick';
  $('hdr').innerHTML=m?`<button class="me" data-x="menu" aria-label="Menu">${crest(teamOf(me,m).m,teamOf(me,m).kit,32)}</button>`:'';
  if(!loaded){$('main').innerHTML=`<p class="mute">${err||'Loading…'}</p>`;return}
  if(!m){tab==='home'?homeView(null):joinView();renderSheet();return}
  tab==='pick'?pickView(m):homeView(m);syncStrips();
  renderSheet();
}
function joinView(){
  const names=Object.entries(P).sort((x,y)=>x[1].name.localeCompare(y[1].name));
  $('main').innerHTML=`<div class="card" style="margin-top:8px"><h2 style="margin:4px 0 4px;font-size:22px">Join the pool</h2>
    <p class="mute" style="margin:0 0 12px">Saturday, Nov 21 · pick a winner in all 14 NHL games.</p>
    <form id="join" style="display:flex;gap:8px"><input id="nick" maxlength="16" placeholder="New player name" autocomplete="off" required><button class="primary">Join</button></form></div>
    ${names.length?`<div class="sec"><h2>Or play as</h2></div><div class="chips">${names.map(([id,p])=>{const t=teamOf(id,p);return `<button data-claim="${esc(id)}">${crest(t.m,t.kit,26)}${esc(p.name)}</button>`}).join('')}</div>`:''}`;
}
function status(g){const s=S[g.id];if(PP.isFinal(s))return 'Final'+(s.period>4?' · SO':s.period>3?' · OT':'');if(PP.isLive(s))return `<b>Live</b> · ${PP.per(s.period)} ${esc(s.clock||'')}`;return locked(g)?'Locked':''}
function pickView(m){
  
  const n=G.filter(g=>m.picks[g.id]).length;
  $('main').innerHTML=`<div class="sec"><h2>Picks <span class="dim">${n}/14</span></h2></div>`+G.map(g=>{
    const k=m.picks[g.id],lk=locked(g),r=result(g),s=S[g.id],sc=s&&(PP.isLive(s)||PP.isFinal(s));
    const oth=Object.keys(P).filter(id=>id!==me),nA=oth.filter(id=>P[id].picks[g.id]==='A').length,nH=oth.filter(id=>P[id].picks[g.id]==='H').length,pot=nA+nH+1;
    const b=(side,ab,pts)=>{let c='t';if(k===side)c+=r?(r===side?' w':' l'):' on';const n=side==='A'?nA:nH;
      const sub=sc?'':`<span class="sub">${n+(k===side?1:0)} picked · wins +${PP.f1(pot/(n+1))}</span>`;
      return `<button class="${c}" data-g="${g.id}" data-s="${side}" ${lk?'disabled':''} aria-pressed="${k===side}" aria-label="${ab}"><span class="tt">${lg(ab,'tl')}${sc?`<small>${pts}</small>`:''}</span>${sub}</button>`};
    const st=status(g);
    return `<div class="card">${st?`<div class="st"><span>${st}</span></div>`:''}<div class="row">${b('A',g.a,s?.as)}${b('H',g.h,s?.hs)}</div></div>`}).join('')+'<button class="primary done" data-tab="home">Done</button>';
}
let boardURL='',drawing=false,boardCanvas=null;
async function drawBoard(){if(drawing)return;drawing=true;
  try{boardCanvas=await Board.draw({P,S,O,me});boardURL=boardCanvas.toDataURL('image/jpeg',.9);const im=$('board');if(im)im.src=boardURL}catch(e){console.error(e)}drawing=false}
function homeView(m){
  const ids=Object.keys(P),T=PP.tally(P,S),W=PP.simulate(P,S,O),A=PP.awards(P,S,T);
  const lead=Math.max(0,...ids.map(id=>T[id].pts));
  const ord=PP.rankOrder(P,S);const rows=ord.map(id=>({id,...T[id],w:W[id]||0,b:A[id]||[]}));
  const pct=w=>w>=.995&&w<1?'>99%':w>0&&w<.005?'<1%':Math.round(w*100)+'%';
  const ICON={fire:'🔥',fade:'👑',sheep:'🐑',bad:'💀',round:'🍺'};
  const n=m?G.filter(g=>m.picks[g.id]).length:0,fin=G.filter(result).length,live=G.filter(g=>PP.isLive(S[g.id])).length;
  const mi=rows.findIndex(r=>r.id===me),mr=rows[mi];
  // hero: one big number
  let hero;
  if(!m)hero=`<div class="big" id="cd">${Date.now()<FIRST?left():PP.f1(lead)}</div><div class="cap">${Date.now()<FIRST?'until picks start locking':'points to beat'}</div><button class="primary pill" data-x="join">Join the pool</button>`;
  else if(Date.now()<FIRST)hero=`<div class="big" id="cd">${left()}</div><div class="cap">until picks start locking</div>
    ${n<14?`<button class="primary pill" data-tab="pick">Make your picks · ${n}/14</button>`:`<div class="ok">✓ All 14 picked</div>`}`;
  else hero=`<div class="big">${mr&&mr.max<lead-1e-9?'Out':'#'+(mi+1)}</div><div class="cap">${PP.f1(mr?mr.pts:0)} pts · ${pct(mr?mr.w:0)} to win · ${fin===14?'Final':live?live+' live':fin+'/14 final'}</div>`;
  if(m)hero+=`<div class="links">${n>=14||Date.now()>=FIRST?`<button class="lnk" data-tab="pick">${Date.now()>=FIRST?'Your picks':'Edit picks'}</button><span class="dim">·</span>`:''}<button class="lnk" data-x="rules">How it works</button></div>`;
  // awards go in the feed, stamped when this phone first saw them
  const AWT={fire:n=>`🔥 ${n} on fire: 3+ in a row`,fade:n=>`👑 Fade King: ${n}, cashed against the crowd`,sheep:n=>`🐑 Sheep: ${n}, went with the crowd`,bad:n=>`💀 Bad beat: ${n}, blew a 3rd-period lead`,round:n=>`🍺 ${n} buys the first round`};
  let seenAw={};try{seenAw=JSON.parse(ls.get('pp_aw')||'{}')}catch{}
  const byK={};for(const id in A)for(const k of A[id])(byK[k]=byK[k]||[]).push(id);
  const AE=Object.entries(byK).map(([k,ids])=>{const key=k+':'+ids.sort().join(',');if(!seenAw[key])seenAw[key]=Date.now();const ns=ids.map(id=>P[id].name);return {key,ts:seenAw[key],short:AWT[k](ns.length>1?ns.slice(0,-1).join(', ')+' & '+ns.at(-1):ns[0])}});
  ls.set('pp_aw',JSON.stringify(seenAw));
  const E=PP.feed(P,S,O,seenAt).filter(e=>['final','lead','out'].includes(e.kind)&&e.ts<=Date.now()+60000).concat(AE).concat(NEWS.map(n=>({key:n.id,ts:n.ts,news:n}))).sort((a,b)=>b.ts-a.ts).slice(0,5);
  const pn=pinNews&&NEWS.find(x=>x.id===pinNews);
  $('main').innerHTML=(pn?`<div class="pin"><div class="pinh"><span class="nk">Puck Pool Report · ${tm(pn.ts)}</span><button class="x" data-x="unpin" aria-label="Close">×</button></div><b>${esc(pn.h)}</b><p>${esc(pn.b)}</p><button class="lnk nsh" data-news="${esc(pn.id)}">Share</button></div>`:'')+`<div class="hero">${hero}</div>
    <div class="sec"><h2>Standings <span class="dim">${ids.length}</span></h2><button class="lnk" data-x="share">Share</button></div>
    <div class="list sl"><div class="lh"><span></span><span class="pkh">Picks →</span><span>Pts</span><span>Max</span><span>Win</span></div>${rows.map((r,i)=>{const p=P[r.id],t=teamOf(r.id,p),out=r.max<lead-1e-9;
      const strip=G.map(g=>{const k=p.picks[g.id],rs=result(g);if(!k)return '<span class="ps none"></span>';
        return `<span class="ps ${rs?(rs===k?'hit':'miss'):''}">${lg(k==='H'?g.h:g.a,'')}</span>`}).join('');
      return `<div class="p ${r.id===me?'mine':''} ${out?'out':''}" data-pl="${esc(r.id)}" role="button" tabindex="0" aria-label="${esc(p.name)}'s picks"><span class="rk">${i+1}</span>${crest(t.m,t.kit,22)}<span class="n">${esc(p.name)}</span>
        <div class="sx">${strip}</div><span class="v">${PP.f1(r.pts)}</span><span class="v dim">${PP.f1(r.max)}</span><span class="v acc">${out?'Out':pct(r.w)}</span></div>`}).join('')}</div>
    ${E.length?`<div class="sec"><h2>Latest</h2></div><div class="list">${E.map(e=>e.news?`<div class="f nw ${openNews===e.news.id?'open':''}" id="${esc(e.news.id)}" data-nopen="${esc(e.news.id)}"><div><div class="nk">Puck Pool Report · ${tm(e.ts)}</div><b>${esc(e.news.h)}</b>${openNews===e.news.id?`<p>${esc(e.news.b)}</p><button class="lnk nsh" data-news="${esc(e.news.id)}">Share</button>`:''}</div></div>`:`<div class="f"><span>${esc(e.short)}</span><time>${tm(e.ts)}</time></div>`).join('')}</div>`:''}`;
}
function playerSheet(id){
  const p=P[id];if(!p)return '';const t=teamOf(id,p),T=PP.tally(P,S)[id],self=id===me;
  return `<div class="who">${crest(t.m,t.kit,40)}<div><b>${esc(teamName(p.name,t.m))}</b><div class="mute">${PP.f1(T.pts)} pts · max ${PP.f1(T.max)}</div></div></div>
  <div class="pk">${G.map(g=>{const k=p.picks[g.id],show=true,r=result(g),s=S[g.id];
    const side=(sd,ab)=>`<span class="pkt ${k===sd?(r?(r===sd?'hit':'miss'):'on'):''}">${lg(ab,'')}</span>`;
    const st=r?(r===k?'<span class="okc">✓</span>':'<span class="noc">✗</span>'):PP.isLive(s)?'<span class="dim">live</span>':'';
    return `<div>${side('A',g.a)}<span class="dim">@</span>${side('H',g.h)}<span class="pst">${k?st:'<span class="dim">no pick</span>'}</span></div>`}).join('')}</div>`;
}
let SX=null;
let SXmoved=false,drag=null;
function maxSX(){const s=document.querySelector('.sx');return s?Math.max(0,s.scrollWidth-s.clientWidth):0}
function setSX(v){SX=Math.max(0,Math.min(maxSX(),v));document.querySelectorAll('.sx').forEach(s=>s.scrollLeft=SX)}
function syncStrips(){if(SX===null){const i=G.findIndex(g=>!result(g));SX=Math.max(0,i-1)*27}setSX(SX);
  const list=document.querySelector('.sl');if(!list||list._w)return;list._w=1;
  // swipe anywhere on a row except the frozen rank/crest/name columns moves every pick strip together
  list.addEventListener('touchstart',e=>{const t=e.touches[0];if(e.target.closest('.rk,.n,.cr'))return;drag={x:t.clientX,y:t.clientY,s:SX,h:null};SXmoved=false},{passive:true});
  list.addEventListener('touchmove',e=>{if(!drag)return;const t=e.touches[0],dx=t.clientX-drag.x,dy=t.clientY-drag.y;
    if(drag.h===null&&(Math.abs(dx)>6||Math.abs(dy)>6))drag.h=Math.abs(dx)>Math.abs(dy);
    if(drag.h){e.preventDefault();SXmoved=true;setSX(drag.s-dx)}},{passive:false});
  list.addEventListener('touchend',()=>{drag=null;setTimeout(()=>SXmoved=false,300)},{passive:true});
  list.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){e.preventDefault();setSX(SX+e.deltaX)}},{passive:false});
}
function renderSheet(){
  const m=mine(),el=$('sheet');if(!sheet||!m){el.innerHTML='';return}
  const t=teamOf(me,m);
  el.innerHTML=`<div class="sheet" data-x="close"><div>${sheet==='team'
    ?`<b>Pick your avatar</b><div class="crests">${MASCOTS.map((n,i)=>`<button data-m="${i}" class="${i===t.m?'on':''}">${crest(i,t.kit,46)}${n}</button>`).join('')}</div>`
    :sheet.startsWith('pl:')?playerSheet(sheet.slice(3))
    :sheet==='sw'?`<b>Switch to</b><div class="names">${Object.entries(P).filter(([id])=>id!==me).map(([id,p])=>`<button data-claim="${esc(id)}">${esc(p.name)}</button>`).join('')}</div>`
    :sheet==='rules'?`<b>How scoring works</b><ul class="rules"><li>Each game is worth 1 point for every person who picked it.</li><li>Everyone who picked the winner splits those points.</li><li>Everyone's picks are visible, so you can play the crowd. You can change a pick until that game starts.</li><li>Max is the most you can still finish with. Win % uses sportsbook odds and live scores.</li><li><b>Ties for 1st:</b> most correct picks, then head-to-head on the games where the tied players picked differently, then whoever had the latest such game right. Still tied: split the pot.</li></ul>`
    :`<div class="who">${crest(t.m,t.kit,40)}<b>${esc(teamName(m.name,t.m))}</b></div><button class="opt" data-x="team">Change avatar</button><button class="opt" data-x="add">Add player</button>${Object.keys(P).length>1?'<button class="opt" data-x="sw">Switch player</button>':''}<button class="opt danger" data-x="del">Remove ${esc(m.name)}</button>`}</div></div>`;
}
function notify(){
  const m=mine();if(!m)return;
  const E=PP.feed(P,S,O,seenAt),seen=new Set(JSON.parse(ls.get('pp_seen')||'[]'));
  if(!ls.get('pp_seen_init')){for(const e of E)if(e.ts<Date.now()-20*60000)seen.add(e.key);ls.set('pp_seen_init','1')}
  const msgs=[];
  for(const e of E){if(seen.has(e.key)||e.ts>Date.now()+60000)continue;seen.add(e.key);
    const k=e.gid&&m.picks[e.gid];
    if(e.kind==='final'&&k)msgs.push(k===e.side?`✅ ${e.team} won · +${PP.f1(e.pts)} pts`:`❌ ${e.team} won · no points`);
    if(e.kind==='lead'&&e.ids.includes(me))msgs.push('👑 You’re in 1st');
    if(e.kind==='out'&&e.ids.includes(me))msgs.push('You’re out of contention');}
  ls.set('pp_seen',JSON.stringify([...seen].slice(-600)));
  msgs.slice(-3).forEach((t,i)=>setTimeout(()=>toast(t),i*2900));
}
async function share(){
  const cv=boardCanvas||await Board.draw({P,S,O,me});const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
  const file=new File([blob],'puck-pool.jpg',{type:'image/jpeg'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='puck-pool.jpg';document.body.appendChild(a);a.click();a.remove();
}
document.addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;const n=$('nick').value.trim().slice(0,16);if(!n)return;
  busy=true;tab='pick';const id='p'+Math.random().toString(36).slice(2,10);save(id);
  try{await post({t:'j',p:id,n})}catch{toast('Couldn’t join. Try again.');me=null}busy=false;render();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-x="close"],h1[data-tab],[data-pl],[data-nopen]');if(!b)return;const x=b.dataset.x;
  if(x==='close'){if(e.target===b){sheet=null;renderSheet()}return}
  if(b.dataset.tab)sheet=null;
  if(b.dataset.tab&&!mine()){const pv=ls.get('pp_prev');if(pv&&P[pv])save(pv);tab='home';render();scrollTo(0,0);return}
  if(b.dataset.tab){tab=b.dataset.tab;open=null;render();scrollTo(0,0);return}
  if(b.dataset.claim){save(b.dataset.claim);sheet=null;tab='home';render();scrollTo(0,0);return}
  if(b.dataset.pl){if(SXmoved)return;sheet='pl:'+b.dataset.pl;renderSheet();return}
  if(x==='menu'){sheet='menu';renderSheet();return}
  if(x==='team'){sheet='team';renderSheet();return}
  if(x==='rules'){sheet='rules';renderSheet();return}
  if(x==='sw'){sheet='sw';renderSheet();return}
  if(x==='rules'&&!mine())return;
  if(x==='out'){if(me)ls.set('pp_prev',me);sheet=null;me=null;ls.del('pp_me');tab=null;render();return}
  if(b.dataset.nopen){openNews=openNews===b.dataset.nopen?null:b.dataset.nopen;render();return}
  if(b.dataset.news){const n=NEWS.find(x=>x.id===b.dataset.news);if(!n)return;
    const txt=`🏒 ${n.h}\n${location.origin+location.pathname}#${n.id}`;
    try{if(navigator.share){await navigator.share({text:txt});return}}catch(err){if(err.name==='AbortError')return}
    try{await navigator.clipboard.writeText(txt);toast('Copied. Paste it in the group text')}catch{toast('Couldn’t copy')}return}
  if(x==='unpin'){pinNews=null;try{history.replaceState(null,'',location.pathname)}catch{}render();return}
  if(x==='share'){share();return}
  if(x==='join'){tab='join';render();setTimeout(()=>$('nick')&&$('nick').focus(),50);return}
  if(x==='add'){if(me)ls.set('pp_prev',me);me=null;ls.del('pp_me');tab=null;sheet=null;render();setTimeout(()=>$('nick')&&$('nick').focus(),50);return}
  if(busy)return;
  if(x==='del'){if(!confirm('Remove '+P[me].name+' and all their picks?'))return;busy=true;
    try{await post({t:'x',p:me});me=null;ls.del('pp_me');sheet=null;tab=null}catch{toast('Couldn’t remove. Try again.')}busy=false;render();return}
  const act=async(fn,msg,ok)=>{busy=true;fn();render();try{await post(msg);toast(ok)}catch{toast('Didn’t save. Tap again.');build()}busy=false;render()};
  if(b.dataset.m){const m=+b.dataset.m;sheet=null;await act(()=>{P[me].mascot=m},{t:'m',p:me,m},'Saved ✓');return}
  if(b.dataset.g){const g=GI[b.dataset.g],side=b.dataset.s;if(!g||locked(g))return;
    await act(()=>{P[me].picks[g.id]=side},{t:'p',p:me,g:g.id,s:side},'Saved ✓');return}
});
window.__shareCanvas=()=>Board.draw({P,S,O,me}).then(c=>c.toDataURL('image/jpeg',.9));
const hashNews=()=>{const m=/^#(n\d+)$/.exec(location.hash);if(m){pinNews=m[1];tab='home';sheet=null}};
hashNews();addEventListener('hashchange',()=>{hashNews();render();scrollTo(0,0)});
load();
setInterval(()=>{if(!busy&&!document.hidden&&!sheet)load()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy)load()});
}
